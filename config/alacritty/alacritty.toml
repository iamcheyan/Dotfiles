# Theme colors are imported from the active theme pack.
general.import = [ "~/.local/state/sumika-shell/theme/current/alacritty.toml" ]

# ===== Font =====
[font]
size = 14.0

[font.normal]
family = "MesloLGS Nerd Font Mono"
style = "Regular"

[font.bold]
family = "MesloLGS Nerd Font Mono"
style = "Bold"

[font.italic]
family = "MesloLGS Nerd Font Mono"
style = "Italic"

[font.bold_italic]
family = "MesloLGS Nerd Font Mono"
style = "Bold Italic"

[selection]
save_to_clipboard = true

# ===== Window =====
[window]
padding = { x = 5, y = 5 }
decorations = "Full"
opacity = 1.0

# ===== Scrolling =====
[scrolling]
history = 10000

# ===== Keyboard Bindings =====
[keyboard]
bindings = [
  { key = "C",      mods = "Shift|Control", action = "Copy" },
  { key = "V",      mods = "Shift|Control", action = "Paste" },
  { key = "V",      mods = "Control",       action = "Paste" },
  { key = "F11",    action = "ToggleFullscreen" },
  { key = "F",      mods = "Shift|Control", action = "ToggleSimpleFullscreen" },
  { key = "Plus",   mods = "Control", action = "IncreaseFontSize" },
  { key = "Minus",  mods = "Control", action = "DecreaseFontSize" },
  { key = "Key0",   mods = "Control", action = "ResetFontSize" },
]