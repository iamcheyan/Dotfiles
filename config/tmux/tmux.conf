# 256色支持和真彩色 (Truecolor / RGB) 支持
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-overrides ",*:Tc"
set -g status-style "bg=#13a10e,fg=#000000"
#
# 开启鼠标支持
set -g mouse on

# Vim 风格复制模式
setw -g mode-keys vi

# 窗口和 pane 从 1 开始编号
set -g base-index 1
setw -g pane-base-index 1

# 自动重编号窗口
set -g renumber-windows on

# 增加历史记录行数
set -g history-limit 200000

# 减少 Escape 延迟
set -sg escape-time 0

# 开启焦点事件
set -g focus-events on

# 新窗口保持当前路径
bind c new-window -c "#{pane_current_path}"

set -g automatic-rename-format '#{b:pane_current_path}'

set -g pane-border-style fg=colour236
set -g pane-active-border-style fg=colour236

# 扩展按键支持
set -g extended-keys on
set -g extended-keys-format csi-u

# 调整 pane 大小
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
#
# ==========================
# ===  插件管理 (TPM)  ===
# ==========================

# TPM 插件管理器
# 安装插件: Prefix + I
# 更新插件: Prefix + U
# 删除失效插件: Prefix + Alt + u
set -g @plugin 'tmux-plugins/tpm'

# 基础增强（无快捷键）
set -g @plugin 'tmux-plugins/tmux-sensible'

# ==========================
# ===  会话保存/恢复  ===
# ==========================
#
# tmux-persist (maintained fork of tmux-resurrect)
#
# 自动行为（全部默认开启）:
#   - client-detached / session-closed 时自动保存
#   - session-created 时自动恢复（同名 session 恢复到上次状态）
#   - zshexit hook: Ctrl-d 退出 shell 前保存（见 zshrc）
#
# 手动: Prefix + Ctrl-s 保存 / Prefix + Ctrl-r 恢复
# https://github.com/hyoretsu/tmux-persist
set -g @plugin 'hyoretsu/tmux-persist'

# tmux-continuum: 定时自动保存（默认每 15 分钟）
# 作为 detach/exit 保存的补充——即使忘记退出也有定期快照
# 注意: continuum 用 @resurrect-save-script-path 找保存脚本，
# 而 tmux-persist 注册的是 @persist-save-script-path，两者不兼容。
# 另外 continuum 调用 save.sh 时只传 "quiet"（保存当前 client session），
# 但从 status-right 运行时没有 attached client，#{client_session} 为空，
# 会导致什么都不保存。所以用一个 wrapper 加上 "all" 参数，
# 让定时保存覆盖所有 session（与原 tmux-resurrect 行为一致）。
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-save-script-path "$HOME/dotfiles/config/tmux/continuum_save_wrapper.sh"
set -g @resurrect-restore-script-path "$HOME/.tmux/plugins/tmux-persist/scripts/restore.sh"
# continuum 自带的 auto-restore 关闭（tmux-persist 的 session-created hook 已经处理）
set -g @continuum-restore 'off'
# 定时保存间隔（分钟），0 = 禁用
set -g @continuum-save-interval '15'

# neovim: 不设 strategy — 直接重启 nvim（原命令原参数）
# auto-session 插件在 nvim 启动时自动按 cwd 恢复上次会话

# AI agent CLI 恢复
# 默认列表已包含: claude codex copilot cursor-agent agy gemini opencode
# (claude/agy/copilot/cursor-agent/opencode 是原生二进制，词匹配直接命中；
#  codex 虽然也在默认列表但通过 node 启动，pane_command=node，词匹配失效)
#
# 需要额外添加的 agent（不在默认列表中）:
#   ~codex ~omp ~pi  → node/bun 包装，pane_command=node/bun，用 ~ 正则匹配
#   grok mimo kiro-cli → 原生二进制，pane_command=工具名，词匹配直接命中
# （eval set 会把 > 当重定向，不能用 -> 内联策略，所以只用 ~ 做匹配）
set -g @persist-processes '~codex ~omp ~pi grok mimo kiro-cli'
#
# 恢复时通过 pre-restore-pane-processes hook 改写 layout 中的 full_command，
# 自动加上会话恢复参数（已有 resume/continue 的命令不变）:
#   omp      → omp --continue
#   codex    → codex resume --last
#   pi       → pi --continue
#   grok     → grok --continue
#   mimo     → mimo -c --dangerously-skip-permissions
#   kiro-cli → kiro-cli chat -r
# 原生二进制 agent (claude/agy/copilot/cursor-agent/opencode) 由插件自带的
# strategy 文件处理，不需要 hook 改写。
# hook 脚本在 dotfiles 仓库中，不依赖插件目录，TPM 更新不会影响。
set -g @persist-hook-pre-restore-pane-processes '$HOME/dotfiles/config/tmux/pre-restore-agents.sh'

# pane 内容保存（默认已启用）
# 快照保留 7 天，存于 ~/.local/share/tmux/resurrect/（兼容旧目录）

# ==========================
# ===  复制增强  ===
# ==========================

# tmux-yank
#
# 使用方式:
# Prefix + [
# v     开始选择
# y     复制到系统剪贴板
#
# 需要系统安装:
#   macOS   -> pbcopy
#   WSL/X11 -> xclip
#   Wayland -> wl-copy
set -g @plugin 'tmux-plugins/tmux-yank'

# ==========================
# ===  Vim/Tmux 导航  ===
# ==========================

# vim-tmux-navigator
#
# 在 tmux pane 和 vim split 之间无缝切换
#
# 直接按（不需要 Prefix）
# Ctrl-h   向左
# Ctrl-j   向下
# Ctrl-k   向上
# Ctrl-l   向右
set -g @plugin 'christoomey/vim-tmux-navigator'

# ==========================
# ===  FZF 搜索  ===
# ==========================

# tmux-fzf
#
# 常见功能:
# Prefix + f  搜索 Session/Window/Pane
#
# 实际快捷键可查看:
# tmux list-keys | grep fzf
set -g @plugin 'sainnhe/tmux-fzf'

# ===  TPM 初始化  ===
# ==========================

run '~/.tmux/plugins/tpm/tpm'

# ===  空快照守卫 (save-on-exit / restore 钩子覆盖) ===
# ========================================================
# tmux-persist 在 persist.tmux 里把 client-detached / session-closed /
# session-created 钩子硬编码为直接调自己的 save.sh / restore.sh。
# 关机时 systemd 给 tmux server 发 SIGTERM，session-closed 钩子在会话
# 已经没有 pane 的情况下触发，save.sh 写出一个 20 字节空快照并无条件覆盖
# <session>_last，下次开机 session-created 钩子读到空快照就什么都恢复不了。
#
# persist.tmux 用 set-hook -g（非 -a），所以这里在 `run tpm` 之后用 set-hook -g
# 覆盖它注册的钩子，改为走 dotfiles 里的守卫脚本：
#   保存侧: 跳过空会话，不动 <session>_last 指针。
#   恢复侧: 若 last 指向空快照，回退到该 session 最近一个非空快照再恢复。
# 守卫脚本在 dotfiles 仓库，TPM 更新不会影响。
if '[ -x "$HOME/dotfiles/config/tmux/persist_save_guard.sh" ]' {
	set-hook -g client-detached 'run-shell "$HOME/dotfiles/config/tmux/persist_save_guard.sh quiet all"'
	set-hook -g session-closed   'run-shell "$HOME/dotfiles/config/tmux/persist_save_guard.sh quiet all"'
}
if '[ -x "$HOME/dotfiles/config/tmux/persist_restore_guard.sh" ]' {
	set-hook -g session-created  'run-shell "$HOME/dotfiles/config/tmux/persist_restore_guard.sh #{hook_session_name} quiet"'
}
