# 256色支持和真彩色 (Truecolor / RGB) 支持
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-overrides ",*:Tc"
set -g status-style "bg=#13a10e,fg=#000000"
#
# 开启鼠标支持
set -g mouse on

# Vim 风格复制模式
setw -g mode-keys vi

# 窗口和 pane 从 1 开始编号
set -g base-index 1
setw -g pane-base-index 1

# 自动重编号窗口
set -g renumber-windows on

# 增加历史记录行数
set -g history-limit 200000

# 减少 Escape 延迟
set -sg escape-time 0

# 开启焦点事件
set -g focus-events on

# 新窗口保持当前路径
bind c new-window -c "#{pane_current_path}"

set -g automatic-rename-format '#{b:pane_current_path}'

set -g pane-border-style fg=colour236
set -g pane-active-border-style fg=colour236

# 扩展按键支持
set -g extended-keys on
set -g extended-keys-format csi-u

# 调整 pane 大小
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
#
# ==========================
# ===  插件管理 (TPM)  ===
# ==========================

# TPM 插件管理器
# 安装插件: Prefix + I
# 更新插件: Prefix + U
# 删除失效插件: Prefix + Alt + u
set -g @plugin 'tmux-plugins/tpm'

# 基础增强（无快捷键）
set -g @plugin 'tmux-plugins/tmux-sensible'

# ==========================
# ===  会话保存/恢复  ===
# ==========================
#
# tmux-persist (fork of tmux-resurrect)
#
# 自动行为:
#   - detach / disconnect / exit 时自动保存
#   - 新建会话时自动恢复
#
# 恢复历史快照:
#   cd ~/.tmux/persist/
#   ln -sf <snapshot>.txt <session>_last
#   新建同名 session 后按 Prefix + Ctrl-r
# https://github.com/hyoretsu/tmux-persist
set -g @plugin 'hyoretsu/tmux-persist'

# vim: 恢复 Session.vim（需要 tpope/vim-obsession）
set -g @persist-strategy-vim 'session'
# neovim: 默认策略 — 直接重启 nvim（原命令原参数）
# auto-session 插件在 nvim 启动时自动按 cwd 恢复上次会话，无需 Session.vim

# AI agent CLI 恢复（默认已启用，无需额外配置）
# 支持: claude, codex, copilot, cursor-agent, agy, gemini, opencode
# 恢复逻辑: 自动重写为各 CLI 的 --continue / --resume 参数
#
# 若只想恢复部分 agent，取消注释并编辑:
# set -g @persist-processes 'claude codex opencode'
#
# 若想禁用某个 agent 的恢复，取消注释并编辑:
# set -g @persist-strategy-gemini ''

# pane 内容保存（默认已启用）
# 快照保留 7 天，存于 ~/.tmux/persist/ 或 ~/.local/share/tmux/persist/

# ==========================
# ===  复制增强  ===
# ==========================

# tmux-yank
#
# 使用方式:
# Prefix + [
# v     开始选择
# y     复制到系统剪贴板
#
# 需要系统安装:
#   macOS   -> pbcopy
#   WSL/X11 -> xclip
#   Wayland -> wl-copy
set -g @plugin 'tmux-plugins/tmux-yank'

# ==========================
# ===  Vim/Tmux 导航  ===
# ==========================

# vim-tmux-navigator
#
# 在 tmux pane 和 vim split 之间无缝切换
#
# 直接按（不需要 Prefix）
# Ctrl-h   向左
# Ctrl-j   向下
# Ctrl-k   向上
# Ctrl-l   向右
set -g @plugin 'christoomey/vim-tmux-navigator'

# ==========================
# ===  FZF 搜索  ===
# ==========================

# tmux-fzf
#
# 常见功能:
# Prefix + f  搜索 Session/Window/Pane
#
# 实际快捷键可查看:
# tmux list-keys | grep fzf
set -g @plugin 'sainnhe/tmux-fzf'

# ===  TPM 初始化  ===
# ==========================

run '~/.tmux/plugins/tpm/tpm'
